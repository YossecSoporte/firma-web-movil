services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firmeasy-web
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=60
      - BASE_URL_EXTERNO=http://10.21.132.143:8081
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: firmeasy-network