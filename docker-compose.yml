services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: firmeasy-web
    ports:
      - "8081:80"
    volumes:
      - ./:/var/www/html
    environment:
      - PHP_MEMORY_LIMIT=256M
      - PHP_MAX_EXECUTION_TIME=60
      - BASE_URL_EXTERNO=http://localhost:8081
      - ENCRYPTION_KEY=l1L0gPaxGHkH/aei5Hs7awe8XhPrHHtzywfZYF+mTc0=
      - FIRMEASY_API_KEY=sk_live_DvkVAvtOjMc4604AzWM8kruHtu9V4RjN
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  default:
    name: firmeasy-network