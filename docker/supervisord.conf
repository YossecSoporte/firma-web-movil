[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=php-fpm -R --nodaemonize --fpm-config /usr/local/etc/php-fpm.conf
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/php-fpm.log
stderr_logfile=/var/log/php-fpm.err.log
startsecs=1

[program:nginx]
command=nginx -g "daemon off;"
user=root
autostart=true
autorestart=true
stdout_logfile=/var/log/nginx.access.log
stderr_logfile=/var/log/nginx.error.log

[program:php-fpm-health]
command=/bin/sh -c "while true; do sleep 30; curl -f http://localhost/ || exit 1; done"
autostart=true
autorestart=true