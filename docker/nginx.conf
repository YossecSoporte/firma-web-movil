server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 128M;
    client_body_buffer_size 128M;
    client_body_timeout 300s;
    fastcgi_read_timeout 300;
    fastcgi_send_timeout 300;

    # API endpoints - deben ir ANTES del location / genérico
    location ~ ^/api/job/([^/]+)$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/api/job.php;
        fastcgi_param PATH_INFO /$1;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ ^/api/token/([^/]+)$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root/api/token.php;
        fastcgi_param PATH_INFO /$1;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ ^/api/(generar-uri|generar-job|list-pdfs|list-signed|download|download-signed|upload-signed|clear-signed|callback)\.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 600;
    }

    location /pesados {
        try_files $uri $uri/ /pesados.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60;
    }

    location ~ /\.ht {
        deny all;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}